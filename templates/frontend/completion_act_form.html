{% extends 'base.html' %}

{% block title %}Новый акт | ForWork ERP{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="{% url 'frontend:completion_act_list' %}">Акты</a></li>
                    <li class="breadcrumb-item active">Новый</li>
                </ol>
            </nav>
            <h2 class="fw-light mt-2">Создание акта выполненных работ</h2>
        </div>
        <a href="{% url 'frontend:completion_act_list' %}" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg me-1"></i>Отмена
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form id="actForm">
                {% csrf_token %}

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Задача <span class="text-danger">*</span></label>
                        <select name="task" id="task" class="form-select" required onchange="loadWorkOrders()">
                            <option value="">Выберите задачу</option>
                            {% for t in tasks %}
                                <option value="{{ t.id }}">#{{ t.id }} - {{ t.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Наряд</label>
                        <select name="work_order" id="work_order" class="form-select">
                            <option value="">Сначала выберите задачу</option>
                        </select>
                        <small class="text-muted">Будут показаны только наряды выбранной задачи</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Дата выполнения</label>
                        <input type="date" name="completion_date" id="completion_date" class="form-control" value="{{ today|date:'Y-m-d' }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Комментарий</label>
                        <textarea name="comment" id="comment" class="form-control" rows="2"></textarea>
                    </div>
                </div>

                <h5 class="mb-3">Фактические материалы</h5>
                <div id="materialsContainer"></div>
                <button type="button" class="btn btn-outline-primary mt-2" onclick="addMaterialRow()">
                    <i class="bi bi-plus-lg me-1"></i>Добавить материал
                </button>

                <hr class="my-4">

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check-lg me-1"></i>Создать акт
                    </button>
                    <a href="{% url 'frontend:completion_act_list' %}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    // Все наряды из Django
    const allWorkOrders = [
        {% for w in work_orders %}
        { id: {{ w.id }}, number: "{{ w.number|escapejs }}", task_id: {{ w.task_id }} }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    // Складские позиции
    const warehouseItems = [
        {% for item in warehouse_items %}
        { id: {{ item.id }}, name: "{{ item.name|escapejs }}", unit: "{{ item.get_unit_display }}" }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];

    console.log('Work orders loaded:', allWorkOrders.length);

    // Загрузка нарядов для выбранной задачи
    function loadWorkOrders() {
        const taskId = document.getElementById('task').value;
        const select = document.getElementById('work_order');

        if (!taskId) {
            select.innerHTML = '<option value="">Сначала выберите задачу</option>';
            return;
        }

        // Фильтруем наряды по задаче
        const filtered = allWorkOrders.filter(w => w.task_id == taskId);

        if (filtered.length === 0) {
            select.innerHTML = '<option value="">Нет нарядов для этой задачи</option>';
            return;
        }

        // Заполняем select
        let options = '<option value="">Не указывать наряд</option>';
        filtered.forEach(w => {
            options += `<option value="${w.id}">${w.number}</option>`;
        });
        select.innerHTML = options;
    }

    // Добавить строку материала
    function addMaterialRow() {
        const container = document.getElementById('materialsContainer');
        const row = document.createElement('div');
        row.className = 'row g-2 mb-2 align-items-end';

        let options = '<option value="">Выберите материал</option>';
        warehouseItems.forEach(function(item) {
            options += `<option value="${item.id}">${item.name} (${item.unit})</option>`;
        });

        row.innerHTML = `
            <div class="col-md-8">
                <select class="form-select mat-select" required>
                    ${options}
                </select>
            </div>
            <div class="col-md-3">
                <input type="number" step="0.001" class="form-control mat-qty" placeholder="Количество" value="1" required>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('.row').remove()">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        `;

        container.appendChild(row);
    }

    // Отправка формы
    document.getElementById('actForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Создание...';

        // Собираем материалы
        const materials = [];
        document.querySelectorAll('#materialsContainer .row').forEach(function(row) {
            const select = row.querySelector('.mat-select');
            const qty = row.querySelector('.mat-qty');
            if (select.value && qty.value) {
                materials.push({
                    warehouse_item: parseInt(select.value),
                    actual_quantity: parseFloat(qty.value)
                });
            }
        });

        const data = {
            task: parseInt(document.getElementById('task').value),
            completion_date: document.getElementById('completion_date').value,
            comment: document.getElementById('comment').value || '',
            materials: materials
        };

        const workOrder = document.getElementById('work_order').value;
        if (workOrder) {
            data.work_order = parseInt(workOrder);
        }

        console.log('Sending data:', data);

        try {
            const response = await fetch('/api/documents/completion-acts/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify(data),
            });

            const responseText = await response.text();
            console.log('Response:', responseText);

            if (!response.ok) {
                throw new Error(responseText);
            }

            const result = JSON.parse(responseText);
            const newId = result.id || result.pk;

            if (!newId) {
                alert('Акт создан, но ID не получен. Проверьте список.');
                window.location.href = '/documents/completion-acts/';
                return;
            }

            window.location.href = '/documents/completion-acts/' + newId + '/';

        } catch (error) {
            console.error('Error:', error);
            alert('Ошибка: ' + error.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    });

    // Добавляем одну пустую строку материала
    addMaterialRow();
</script>
{% endblock %}
