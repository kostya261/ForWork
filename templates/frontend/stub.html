{% extends 'base.html' %}

{% block title %}{{ title }} | ForWork ERP{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-light mb-0">{{ title }}</h2>
    </div>
    
    <div class="card">
        <div class="card-body text-center py-5">
            <i class="bi bi-tools fs-1 text-muted"></i>
            <h4 class="mt-3">Раздел в разработке</h4>
            <p class="text-muted">Скоро здесь появится функционал {{ title|lower }}</p>
        </div>
    </div>
</div>
{% endblock %}
