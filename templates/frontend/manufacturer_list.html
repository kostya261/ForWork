{% extends 'base.html' %}
{% block title %}Производители | ForWork ERP{% endblock %}
{% block content %}
<div class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-light mb-0"><i class="bi bi-building me-2"></i>Производители</h2>
        <a href="{% url 'frontend:manufacturer_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Добавить</a>
    </div>
    <div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Название</th><th>Страна</th><th>Сайт</th><th></th></tr></thead>
        <tbody>
            {% for m in manufacturers %}
            <tr><td>{{ m.name }}</td><td>{{ m.country|default:"—" }}</td><td>{{ m.website|default:"—" }}</td>
                <td><a href="{% url 'frontend:manufacturer_edit' m.pk %}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table></div></div>
</div>
{% endblock %}
